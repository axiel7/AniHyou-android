query UserFavoritesAnime($userId: Int, $page: Int, $perPage: Int) {
    User(id: $userId) {
        favourites {
            anime(page: $page, perPage: $perPage) {
                edges {
                    id
                    favouriteOrder
                    node {
                        id
                        title {
                            userPreferred
                        }
                        coverImage {
                            large
                        }
                        isAdult
                    }
                }
                pageInfo {
                    ...CommonPage
                }
            }
        }
    }
}

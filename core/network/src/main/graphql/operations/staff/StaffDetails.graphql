query StaffDetails($staffId: Int) {
    Staff(id: $staffId) {
        id
        name {
            userPreferred
            native
            alternative
        }
        image {
            large
        }
        description
        primaryOccupations
        gender
        dateOfBirth {
            ...FuzzyDate
        }
        dateOfDeath {
            ...FuzzyDate
        }
        height {
            ...Height
        }
        age
        yearsActive
        homeTown
        bloodType
        favourites
        isFavourite
        siteUrl
    }
}
